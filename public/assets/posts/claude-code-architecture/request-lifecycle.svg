<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 一次请求的生命周期</title>
  <desc id="desc">展示用户、Query Runtime、模型、工具权限和 Context Session 之间的请求循环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5c554d"/>
    </marker>
    <style>
      .title { font: 600 30px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #201f1b; }
      .head { font: 600 18px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #201f1b; }
      .step { font: 600 16px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #201f1b; }
      .small { font: 400 14px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #625b53; }
      .lane { stroke: #d8cec2; stroke-width: 2; }
      .line { stroke: #b9afa4; stroke-width: 2; stroke-dasharray: 7 7; }
      .arrow { stroke: #5c554d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .event { stroke: #d8cec2; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1400" height="900" rx="24" fill="#fffaf2"/>
  <text x="52" y="58" class="title">一次请求不是一次 API 调用，而是一轮反馈循环</text>
  <text x="52" y="88" class="small">模型提出动作，Runtime 执行并收集环境反馈，再把结果交回下一轮。</text>

  <rect x="45" y="120" width="1310" height="64" rx="14" fill="#fff0e7"/>
  <text x="176" y="159" text-anchor="middle" class="head">用户</text>
  <text x="440" y="159" text-anchor="middle" class="head">Query Runtime</text>
  <text x="700" y="159" text-anchor="middle" class="head">模型</text>
  <text x="960" y="159" text-anchor="middle" class="head">Tool / Permission</text>
  <text x="1220" y="159" text-anchor="middle" class="head">Context / Session</text>

  <line x1="176" y1="184" x2="176" y2="838" class="line"/>
  <line x1="440" y1="184" x2="440" y2="838" class="line"/>
  <line x1="700" y1="184" x2="700" y2="838" class="line"/>
  <line x1="960" y1="184" x2="960" y2="838" class="line"/>
  <line x1="1220" y1="184" x2="1220" y2="838" class="line"/>

  <rect x="84" y="218" width="184" height="58" rx="12" fill="#fff" class="event"/>
  <text x="176" y="244" text-anchor="middle" class="step">1. 输入目标</text>
  <text x="176" y="264" text-anchor="middle" class="small">“修复登录测试”</text>
  <path d="M270 247H420" class="arrow"/>

  <rect x="350" y="300" width="180" height="72" rx="12" fill="#eaf2f4" class="event"/>
  <text x="440" y="328" text-anchor="middle" class="step">2. 组装请求</text>
  <text x="440" y="349" text-anchor="middle" class="small">prompt / tools / state</text>
  <path d="M530 336H680" class="arrow"/>

  <rect x="610" y="396" width="180" height="72" rx="12" fill="#eaf2f4" class="event"/>
  <text x="700" y="424" text-anchor="middle" class="step">3. 模型响应</text>
  <text x="700" y="445" text-anchor="middle" class="small">文本或 tool_use</text>
  <path d="M790 432H940" class="arrow"/>

  <rect x="870" y="492" width="180" height="78" rx="12" fill="#f2ebfa" class="event"/>
  <text x="960" y="520" text-anchor="middle" class="step">4. 授权判断</text>
  <text x="960" y="543" text-anchor="middle" class="small">allow / ask / deny</text>
  <path d="M1050 531H1200" class="arrow"/>

  <rect x="1130" y="594" width="180" height="78" rx="12" fill="#f4efdf" class="event"/>
  <text x="1220" y="622" text-anchor="middle" class="step">5. 更新状态</text>
  <text x="1220" y="645" text-anchor="middle" class="small">tool_result / append</text>
  <path d="M1130 633C1010 633 1010 730 970 730" class="arrow"/>

  <rect x="870" y="692" width="180" height="78" rx="12" fill="#edf5ed" class="event"/>
  <text x="960" y="720" text-anchor="middle" class="step">6. 执行工具</text>
  <text x="960" y="743" text-anchor="middle" class="small">读文件 / 改代码 / 测试</text>
  <path d="M870 731C750 731 750 815 700 815" class="arrow"/>
  <path d="M700 815C550 815 550 790 440 790" class="arrow"/>
  <text x="725" y="853" text-anchor="middle" class="small">结果回流：下一轮继续，或 end_turn 结束</text>
  <path d="M440 790C440 670 440 570 440 388" class="arrow"/>
  <text x="456" y="590" class="small">compact / retry / continue</text>
</svg>
